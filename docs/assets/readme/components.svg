<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">기술 구성과 담당 기능</title><desc id="desc">실행과 화면: CLI · GitHub Actions, 로컬 변경 / PR 검사, 보고서 · 진단 · 예제; React · TypeScript · Vite, 검사 결과 · 정책 설정, diff · 규칙별 근거; PySide6 · QWebChannel, Qt WebEngine 데스크톱 창, Python 검사 서비스 연결; MCP · JSON-RPC, stdio 도구 호출, 정책 조회와 검사. 검사 엔진: Git · GitHub REST API, 변경 파일과 patch 수집, 로컬 / PR 입력 어댑터; Tree-sitter, 라우트 · 환경변수 · 공개 선언, 언어별 구문 분석; PyYAML · 정책 엔진, 트리거 · 필수 문서 묶음, 심각도 · 예외 승인; 판정과 보고서, PASS · WARN · FAIL, 검증 범위와 근거 기록. 설명과 검증: Claude API · 구독 리뷰, Codex / Claude Code 연동, 선택적 설명 · 체크리스트; pytest · Ruff · mypy, 엔진 테스트 · 정적 검사, 검사 결과의 회귀 확인; Vitest · Testing Library, React 동작 검사, jsdom 테스트 환경; PyInstaller, Windows · macOS 패키지, desktop-build 워크플로우</desc><rect width="1120" height="764" rx="12" fill="#FFFFFF"/><path d="M12 0 H1108 Q1120 0 1120 12 V64 H0 V12 Q0 0 12 0 Z" fill="#55534D"/><text x="560" text-anchor="middle" y="40" font-size="24" font-weight="600" fill="#FFFFFF">기술 구성과 담당 기능</text><rect x="28" y="84" width="332" height="654" rx="12" fill="#F0EEE8" fill-opacity="0.5" stroke="#DCD9D1"/><circle cx="50" cy="113" r="4" fill="#55534D"/><text x="64" y="119" font-size="18" font-weight="600" fill="#20201E">실행과 화면</text><g><rect x="42" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M58 158 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="70" y="173" font-size="17" font-weight="600" fill="#20201E">CLI · GitHub Actions</text><text x="58" y="208" font-size="16" fill="#53616C">로컬 변경 / PR 검사</text><text x="58" y="234" font-size="16" fill="#53616C">보고서 · 진단 · 예제</text></g><g><rect x="42" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M58 304 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="70" y="319" font-size="17" font-weight="600" fill="#20201E">React · TypeScript · Vite</text><text x="58" y="354" font-size="16" fill="#53616C">검사 결과 · 정책 설정</text><text x="58" y="380" font-size="16" fill="#53616C">diff · 규칙별 근거</text></g><g><rect x="42" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M58 450 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="70" y="465" font-size="17" font-weight="600" fill="#20201E">PySide6 · QWebChannel</text><text x="58" y="500" font-size="16" fill="#53616C">Qt WebEngine 데스크톱 창</text><text x="58" y="526" font-size="16" fill="#53616C">Python 검사 서비스 연결</text></g><g><rect x="42" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M58 596 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="70" y="611" font-size="17" font-weight="600" fill="#20201E">MCP · JSON-RPC</text><text x="58" y="646" font-size="16" fill="#53616C">stdio 도구 호출</text><text x="58" y="672" font-size="16" fill="#53616C">정책 조회와 검사</text></g><rect x="394" y="84" width="332" height="654" rx="12" fill="#F0EEE8" fill-opacity="0.5" stroke="#DCD9D1"/><circle cx="416" cy="113" r="4" fill="#55534D"/><text x="430" y="119" font-size="18" font-weight="600" fill="#20201E">검사 엔진</text><g><rect x="408" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M424 158 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="436" y="173" font-size="17" font-weight="600" fill="#20201E">Git · GitHub REST API</text><text x="424" y="208" font-size="16" fill="#53616C">변경 파일과 patch 수집</text><text x="424" y="234" font-size="16" fill="#53616C">로컬 / PR 입력 어댑터</text></g><g><rect x="408" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M424 304 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="436" y="319" font-size="17" font-weight="600" fill="#20201E">Tree-sitter</text><text x="424" y="354" font-size="16" fill="#53616C">라우트 · 환경변수 · 공개 선언</text><text x="424" y="380" font-size="16" fill="#53616C">언어별 구문 분석</text></g><g><rect x="408" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M424 450 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="436" y="465" font-size="17" font-weight="600" fill="#20201E">PyYAML · 정책 엔진</text><text x="424" y="500" font-size="16" fill="#53616C">트리거 · 필수 문서 묶음</text><text x="424" y="526" font-size="16" fill="#53616C">심각도 · 예외 승인</text></g><g><rect x="408" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M424 596 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="436" y="611" font-size="17" font-weight="600" fill="#20201E">판정과 보고서</text><text x="424" y="646" font-size="16" fill="#53616C">PASS · WARN · FAIL</text><text x="424" y="672" font-size="16" fill="#53616C">검증 범위와 근거 기록</text></g><rect x="760" y="84" width="332" height="654" rx="12" fill="#F0EEE8" fill-opacity="0.5" stroke="#DCD9D1"/><circle cx="782" cy="113" r="4" fill="#55534D"/><text x="796" y="119" font-size="18" font-weight="600" fill="#20201E">설명과 검증</text><g><rect x="774" y="140" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M790 158 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="802" y="173" font-size="17" font-weight="600" fill="#20201E">Claude API · 구독 리뷰</text><text x="790" y="208" font-size="16" fill="#53616C">Codex / Claude Code 연동</text><text x="790" y="234" font-size="16" fill="#53616C">선택적 설명 · 체크리스트</text></g><g><rect x="774" y="286" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M790 304 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="802" y="319" font-size="17" font-weight="600" fill="#20201E">pytest · Ruff · mypy</text><text x="790" y="354" font-size="16" fill="#53616C">엔진 테스트 · 정적 검사</text><text x="790" y="380" font-size="16" fill="#53616C">검사 결과의 회귀 확인</text></g><g><rect x="774" y="432" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M790 450 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="802" y="465" font-size="17" font-weight="600" fill="#20201E">Vitest · Testing Library</text><text x="790" y="500" font-size="16" fill="#53616C">React 동작 검사</text><text x="790" y="526" font-size="16" fill="#53616C">jsdom 테스트 환경</text></g><g><rect x="774" y="578" width="304" height="128" rx="8" fill="#FFFFFF" stroke="#DCD9D1"/><path d="M790 596 v18" stroke="#55534D" stroke-width="3" stroke-linecap="round"/><text x="802" y="611" font-size="17" font-weight="600" fill="#20201E">PyInstaller</text><text x="790" y="646" font-size="16" fill="#53616C">Windows · macOS 패키지</text><text x="790" y="672" font-size="16" fill="#53616C">desktop-build 워크플로우</text></g></svg>