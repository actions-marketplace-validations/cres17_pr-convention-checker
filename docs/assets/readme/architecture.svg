<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="762" viewBox="0 0 1120 762" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Drift Gate · 검사 구조</title><desc id="desc">Drift Gate · 검사 구조</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#7058B7" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="762" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="100" rx="24" fill="#182432" stroke="none"/><text x="40" y="64" font-size="34" fill="#FFFFFF" font-weight="650">Drift Gate · 검사 구조</text><g transform="translate(0 -52)"><rect x="40" y="180" width="242" height="46" rx="16" fill="#F1EDFA" stroke="none"/><text x="60" y="209" font-size="18" fill="#7058B7" font-weight="650">CLI</text><rect x="306" y="180" width="242" height="46" rx="16" fill="#F1EDFA" stroke="none"/><text x="326" y="209" font-size="18" fill="#7058B7" font-weight="650">GitHub Action</text><rect x="572" y="180" width="242" height="46" rx="16" fill="#F1EDFA" stroke="none"/><text x="592" y="209" font-size="18" fill="#7058B7" font-weight="650">Desktop</text><rect x="838" y="180" width="242" height="46" rx="16" fill="#F1EDFA" stroke="none"/><text x="858" y="209" font-size="18" fill="#7058B7" font-weight="650">MCP</text><text x="40" y="268" font-size="16" fill="#7058B7" font-weight="650">01  변경과 정책 수집</text><rect x="40" y="288" width="328" height="126" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="315" font-size="12" fill="#7058B7" font-weight="650">INPUT</text><text x="60" y="345" font-size="22" fill="#202B38" font-weight="650">Git / GitHub</text><text x="60" y="372" font-size="16" fill="#657180" font-weight="400">diff · 변경 파일 · patch</text><rect x="396" y="288" width="328" height="126" rx="14" fill="#F1EDFA" stroke="#7058B7"/><text x="416" y="315" font-size="12" fil