<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="734" viewBox="0 0 1120 734" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Drift Gate · 검사 구조</title><desc id="desc">Drift Gate · 검사 구조</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#20201E" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="734" rx="12" fill="#FAF9F6" stroke="#DCD9D1"/><path d="M12 0 H1108 Q1120 0 1120 12 V64 H0 V12 Q0 0 12 0 Z" fill="#55534D"/><text x="560" text-anchor="middle" y="42" font-size="25" fill="#FFFFFF" font-weight="600">Drift Gate · 검사 구조</text><g transform="translate(0 -80)"><rect x="40" y="180" width="242" height="46" rx="16" fill="#F0EEE8" stroke="none"/><text x="60" y="209" font-size="18" fill="#55534D" font-weight="600">CLI</text><rect x="306" y="180" width="242" height="46" rx="16" fill="#F0EEE8" stroke="none"/><text x="326" y="209" font-size="18" fill="#55534D" font-weight="600">GitHub Action</text><rect x="572" y="180" width="242" height="46" rx="16" fill="#F0EEE8" stroke="none"/><text x="592" y="209" font-size="18" fill="#55534D" font-weight="600">Desktop</text><rect x="838" y="180" width="242" height="46" rx="16" fill="#F0EEE8" stroke="none"/><text x="858" y="209" font-size="18" fill="#55534D" font-weight="600">MCP</text><text x="40" y="268" font-size="16" fill="#55534D" font-weight="600">01  변경과 정책 수집</text><rect x="40" y="288" width="328" height="126" rx="8" fill="#586AD3" stroke="#586AD3"/><text x="60" y="315" font-size="12" fill="#55534D" font-weight="600">입력</text><text x="60" y="345" font-size="22" fill="#202B38" font-weight="600">Git / GitHub</text><text x="60" y="372" font-size="16" fill="#657180" font-weight="400">diff · 변경 파일 · patch</text><rect x="396" y="288" width="328" height="126" rx="8" fill="#586AD3" stroke="#586AD3"/><text x="416" y="315" font-size="12" fill="#55534D" font-weight="600">변경 분석</text><text x="416" y="345" font-size="22" fill="#202B38" font-weight="600">Tree-sitter</text><text x="416" y="372" font-size="16" fill="#657180" font-weight="400">라우트 · 환경변수 · 공개 선언</text><rect x="752" y="288" width="328" height="126" rx="8" fill="#586AD3" stroke="#586AD3"/><text x="772" y="315" font-size="12" fill="#55534D" font-weight="600">평가</text><text x="772" y="345" font-size="22" fill="#202B38" font-weight="600">정책 평가</text><text x="772" y="372" font-size="16" fill="#657180" font-weight="400">when → require.groups</text><text x="772" y="397" font-size="16" fill="#657180" font-weight="400">사유 · CODEOWNERS 승인 확인</text><path d="M374 351 L388 351" fill="none" stroke="#55534D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M730 351 L744 351" fill="none" stroke="#55534D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="40" y="458" font-size="16" fill="#55534D" font-weight="600">02  판정과 보고</text><rect x="40" y="478" width="328" height="126" rx="8" fill="#E1E4F7" stroke="#A8B2E8"/><text x="60" y="505" font-size="12" fill="#55534D" font-weight="600">정책</text><text x="60" y="535" font-size="22" fill="#202B38" font-weight="600">정책 YAML</text><text x="60" y="562" font-size="16" fill="#657180" font-weight="400">.drift-gate.yml</text><text x="60" y="587" font-size="16" fill="#657180" font-weight="400">Action 기본 정책: base 커밋</text><rect x="396" y="478" width="328" height="126" rx="8" fill="#586AD3" stroke="#586AD3"/><text x="416" y="505" font-size="12" fill="#55534D" font-weight="600">판정</text><text x="416" y="535" font-size="22" fill="#202B38" font-weight="600">PASS / WARN / FAIL</text><text x="416" y="562" font-size="16" fill="#657180" font-weight="400">위반 심각도 · 검증 상태</text><text x="416" y="587" font-size="16" fill="#657180" font-weight="400">게이트 설정으로 판정</text><rect x="752" y="478" width="328" height="126" rx="8" fill="#E1E4F7" stroke="#A8B2E8"/><text x="772" y="505" font-size="12" fill="#55534D" font-weight="600">보고서</text><text x="772" y="535" font-size="22" fill="#202B38" font-weight="600">리뷰 결과</text><text x="772" y="562" font-size="16" fill="#657180" font-weight="400">Markdown · JSON · HTML</text><text x="772" y="587" font-size="16" fill="#657180" font-weight="400">PR 댓글 · Action artifact</text><path d="M916 420 V440 H560 V470" fill="none" stroke="#55534D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M730 541 L744 541" fill="none" stroke="#55534D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="60" y="632" font-size="15" fill="#657180" font-weight="400">정책 YAML은 위쪽 정책 평가 단계의 기준입니다.</text><rect x="40" y="658" width="1040" height="64" rx="12" fill="#F0EEE8" stroke="none"/><text x="60" y="684" font-size="17" fill="#55534D" font-weight="600">LLM은 선택적 설명 계층</text><text x="60" y="707" font-size="15" fill="#657180" font-weight="400">판정이 끝난 위반 목록에 설명을 더합니다. API 키 없이도 규칙 검사와 판정은 동작합니다.</text></g></svg>