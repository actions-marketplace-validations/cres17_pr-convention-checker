<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="784" viewBox="0 0 1120 784" role="img" aria-labelledby="title desc" font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><title id="title">Drift Gate · 한 규칙의 처리 과정</title><desc id="desc">변경 이유와 누락된 문서를 함께 따라갈 수 있도록 결과를 남깁니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#7058B7" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="1120" height="784" rx="24" fill="#FAFBFC" stroke="#E2E7EC"/><rect x="0" y="0" width="1120" height="152" rx="24" fill="#182432" stroke="none"/><rect x="0" y="116" width="1120" height="36" rx="0" fill="#182432" stroke="none"/><text x="40" y="38" font-size="13" fill="#A8BCCB" font-weight="650">SYSTEM OVERVIEW</text><text x="40" y="85" font-size="34" fill="#FFFFFF" font-weight="650">Drift Gate · 한 규칙의 처리 과정</text><text x="40" y="122" font-size="17" fill="#CFD9E2" font-weight="400">변경 이유와 누락된 문서를 함께 따라갈 수 있도록 결과를 남깁니다.</text><text x="40" y="184" font-size="16" fill="#7058B7" font-weight="650">검사할 변경을 찾기</text><rect x="40" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="236" font-size="22" fill="#202B38" font-weight="650">변경 파일 · patch</text><text x="60" y="266" font-size="16" fill="#657180" font-weight="400">Git diff 또는 PR</text><path d="M373 262 L390 262" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="236" font-size="22" fill="#202B38" font-weight="650">트리거 조건</text><text x="416" y="266" font-size="16" fill="#657180" font-weight="400">when.any_changed</text><path d="M729 262 L746 262" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="202" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="236" font-size="22" fill="#202B38" font-weight="650">필요한 문서 묶음</text><text x="772" y="266" font-size="16" fill="#657180" font-weight="400">require.groups 확인</text><text x="40" y="364" font-size="16" fill="#7058B7" font-weight="650">조건이 충족되지 않았을 때</text><rect x="40" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="416" font-size="22" fill="#202B38" font-weight="650">누락 · 판단 불가</text><text x="60" y="446" font-size="16" fill="#657180" font-weight="400">검증 방법과 근거 기록</text><path d="M373 442 L390 442" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="416" font-size="22" fill="#202B38" font-weight="650">예외 요청 확인</text><text x="416" y="446" font-size="16" fill="#657180" font-weight="400">사유 · 정책상 승인 검증</text><path d="M729 442 L746 442" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="382" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="416" font-size="22" fill="#202B38" font-weight="650">게이트 판정</text><text x="772" y="446" font-size="16" fill="#657180" font-weight="400">심각도와 설정에 따라 결정</text><text x="40" y="544" font-size="16" fill="#7058B7" font-weight="650">검사 결과 전달</text><rect x="40" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="60" y="596" font-size="22" fill="#202B38" font-weight="650">PASS / WARN / FAIL</text><text x="60" y="626" font-size="16" fill="#657180" font-weight="400">검사 대상 없음은 별도 처리</text><path d="M373 622 L390 622" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="396" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="416" y="596" font-size="22" fill="#202B38" font-weight="650">보고서 생성</text><text x="416" y="626" font-size="16" fill="#657180" font-weight="400">Markdown · JSON · HTML</text><path d="M729 622 L746 622" fill="none" stroke="#7058B7" stroke-width="2"  marker-end="url(#arrow)"/><rect x="752" y="562" width="328" height="120" rx="14" fill="#FFFFFF" stroke="#DCE3E9"/><text x="772" y="596" font-size="22" fill="#202B38" font-weight="650">호출 환경으로 전달</text><text x="772" y="626" font-size="16" fill="#657180" font-weight="400">로컬 출력 · PR 댓글 · artifact</text><text x="40" y="761" font-size="13" fill="#657180" font-weight="400">LLM 설명은 선택 사항이며, 판정 엔진의 결과를 대체하지 않습니다.</text></svg>